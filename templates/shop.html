{% extends 'base.html' %}{% block content %}<div class="page-title"><small>SHOP</small><h1>소금 구매</h1><p>회사가 직접 주문을 확인하고 배송하는 상품입니다.</p></div><div class="product-grid">{% for p in products %}<article class="product"><img src="{{url_for('static',filename=p.image)}}"><h3>{{p.name}}</h3><p>{{p.description}}</p><strong>{{'{:,}'.format(p.price)}}원</strong><a class="btn gold" href="{{url_for('buy',product_id=p.id) if current_user.is_authenticated else url_for('login')}}">구매하기</a></article>{% endfor %}</div>{% endblock %}
