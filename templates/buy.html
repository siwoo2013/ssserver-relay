{% extends 'base.html' %}{% block content %}<div class="checkout"><div><img src="{{url_for('static',filename=product.image)}}"><h2>{{product.name}}</h2><strong>{{'{:,}'.format(product.price)}}원</strong></div><form method="post"><h2>배송정보</h2><label>수량<input type="number" name="qty" value="1" min="1"></label><label>받는 분<input name="recipient" value="{{current_user.name}}" required></label><label>연락처<input name="phone" required></label><label>배송주소<textarea name="address" required></textarea></label><button class="btn gold">주문 확정</button><p class="muted">※ V1 초안은 실제 PG 결제 연동 전 단계입니다.</p></form></div>{% endblock %}
